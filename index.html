  #ctrlR button[data-k="up"]{width:96px;height:96px;font-size:30px}

  #pauseBtn,#muteBtn{position:fixed;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:3px solid #fff8;background:#0005;color:#fff;font-size:15px;font-weight:900;display:none;touch-action:none;padding:0}

  @media (pointer:coarse){.ctrl{display:flex} #pauseBtn,#muteBtn{display:block} #hud{right:114px} #pause small{display:none}}
  /* Menüs: Hochformat = Blatt unten (Auto darüber), Querformat = Panel rechts (Auto links). Inhalt wird per JS (fitSheet) so skaliert, dass nie gescrollt werden muss. */
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:64vh;max-height:64dvh;overflow:hidden;background:#fffffff2;border-radius:20px 20px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0004;color:#222;max-width:620px;margin:0 auto;box-sizing:border-box}

  #sand.hide::before{animation:none}

  @media (orientation:landscape){.mgrid{grid-template-columns:1fr 1fr 1fr 1fr}}
  .mbtn{border:0;border-radius:14px;padding:10px 8px;font:800 16px system-ui,sans-serif;background:#f1f3f6;color:#1d3557}

  .set button{border:0;border-radius:10px;padding:8px 12px;font-weight:800;background:#eef0f3;color:#333;font-size:14px}
  .help p{margin:6px 0;font-size:14px;line-height:1.45}
  .row2{display:flex;gap:8px} .row2 .go{flex:1}

  #pause .sec{background:#1d3557;font-size:16px;padding:10px 22px}
  .hsnew{margin-top:10px;padding:8px 10px;border-radius:10px;background:#fff7d6;color:#7a5b00;font-size:15px}
</style>

<body>
<div id="hud" class="hide">
  <div id="progWrap"><span id="distTxt">0 / 2000 m</span><div id="progBar"><div id="progFill"></div></div></div>
  <div id="row">
    <div class="bar">❤️ Zustand<div class="b"><div id="hpFill"></div></div></div>
    <div class="bar">⛽ Sprit<div class="b"><div id="fuelFill"></div></div></div>
    <div id="coinsRun">🪙 0</div>
  </div>
</div>
<div id="speed" class="hide">0 <small>km/h</small></div>
<div id="sand" class="hide"></div>
<div id="speedfx"></div>
<div id="combo"></div>
<div id="pop"></div>
<div id="flash"></div>
<div id="msg"></div>
<button id="pauseBtn" class="hide" aria-label="Pause">❚❚</button>
<button id="muteBtn" class="hide" aria-label="Ton an/aus">🔊</button>
<div id="pause" class="hide"><div class="t">Pause</div><button id="resumeBtn">▶ Weiter</button><button id="quitBtn" class="sec">🏠 Hauptmenü</button><small>P / Esc zum Fortsetzen · M Ton an/aus</small></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#cfe0f0;color:#1d3557;font:800 22px system-ui,sans-serif;z-index:9;flex-direction:column;gap:6px"><span style="font-size:34px;font-weight:900">threedrazer</span>Strecke wird gebaut …</div>
<div class="ctrl hide" id="ctrlL"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="ctrl hide" id="ctrlR"><button data-k="down">⏬</button><button data-k="up">⏫</button></div>

<div class="sheet" id="menu"></div>
<div class="sheet hide" id="garage"></div>
<div class="sheet hide" id="panel"></div>
<div class="sheet hide" id="result"></div>

<script src="vendor/three.min.js"></script>
<script>
let GOAL = 2000; const ROAD = 8;   // Streckenlänge (m, je nach Strecke), halbe Straßenbreite
const $ = id => document.getElementById(id);

// ---------- Speicherstand ----------
const UP = [
  { k: 'motor', name: 'Motor', ic: '🔧', ds: 'Höchstgeschwindigkeit', base: 50 },
  { k: 'accel', name: 'Getriebe', ic: '⚙️', ds: 'Beschleunigung', base: 40 },
  { k: 'grip',  name: 'Reifen', ic: '🛞', ds: 'Lenkung & Grip', base: 30 },
  { k: 'armor', name: 'Panzerung', ic: '🛡️', ds: 'Hält mehr Schaden aus', base: 45 },
  { k: 'tank',  name: 'Tank', ic: '⛽', ds: 'Mehr Sprit', base: 35 },
];
const MAX = 6;
const N_TRACKS = 5;
// Fahrzeuge: jedes hat eigene Faktoren und eigene Werkstatt-Upgrades (muss neu aufgebaut werden)
const VEH = [
  { k: 'suv', name: 'SUV-Coupé', ic: '🚙', price: 0, ds: 'Der Allrounder – solide in allem.',
    mul: { maxV: 1, acc: 1, grip: 1, hp: 1, fuel: 1 }, dmg: 1, push: 1, pitch: 1, cam: [4.8, 10, 1], show: 1, shadow: [1, 1] },
  { k: 'lkw', name: 'Gelber LKW', ic: '🚚', price: 900, ds: 'Langsam und träge, aber ein Panzer: steckt Treffer weg und walzt durch.',
    mul: { maxV: 0.85, acc: 0.72, grip: 0.8, hp: 2.1, fuel: 1.6 }, dmg: 0.6, push: 0.45, pitch: 0.62, cam: [6.4, 12.5, 1.8], show: 1.45, shadow: [1.05, 1.45] },
  { k: 'f1', name: 'Roter Formel 1', ic: '🏎️', price: 2500, ds: 'Rasend schnell, klebt auf der Straße – aber sehr empfindlich.',
    mul: { maxV: 1.35, acc: 1.55, grip: 1.35, hp: 0.55, fuel: 0.8 }, dmg: 1, push: 1, pitch: 1.7, cam: [4.0, 9, 0.6], show: 0.95, shadow: [0.85, 1.15] },
  { k: 'bus', name: 'Grüner Bus', ic: '🚌', price: 1600, ds: 'Lang und gemütlich, robust – Fahrgäste zahlen mit: +25 % Münzen.',
    mul: { maxV: 0.9, acc: 0.68, grip: 0.75, hp: 1.8, fuel: 1.9 }, dmg: 0.7, push: 0.55, pitch: 0.75, cam: [6.2, 13.5, 1.6], show: 1.75, shadow: [1.05, 2.2], coinMul: 1.25 },
  { k: 'jet', name: 'Weißer Airbus', ic: '✈️', price: 30000, ds: 'Hebt ab 50 km/h ab und überfliegt einfach jedes Hindernis. Sündhaft teuer.',
    mul: { maxV: 1.45, acc: 0.85, grip: 0.9, hp: 1.3, fuel: 2.4 }, dmg: 1, push: 1, pitch: 0.55, cam: [8.5, 17, 3.2], show: 2.3, shadow: [3.2, 2.6], fly: true, upMul: 3 },
];
const vehOf = k => VEH.find(v => v.k === k) || VEH[0];
const HS_PER_TRACK = 10;
const LV0 = () => ({ motor: 0, accel: 0, grip: 0, armor: 0, tank: 0 });
let save = { v: 5, music: true, coins: 0, lv: LV0(), lvc: { suv: LV0() }, best: 0, wins: 0, tr: [], unlocked: 1, track: 0, car: 'suv', cars: ['suv'], hs: [], name: 'Fahrer' };
const SAVE_KEY = 'threedrazer', MUTE_KEY = 'threedrazer_mute';
// Alten Speicherstand von "Schrott Racer" einmalig übernehmen
try {
  if (localStorage.getItem(SAVE_KEY) === null && localStorage.getItem('schrottracer') !== null)
    localStorage.setItem(SAVE_KEY, localStorage.getItem('schrottracer'));
  if (localStorage.getItem(MUTE_KEY) === null && localStorage.getItem('schrottracer_mute') !== null)
    localStorage.setItem(MUTE_KEY, localStorage.getItem('schrottracer_mute'));
} catch (e) {}
// Speicherstand laden und auf Format v3 bringen. Alte Stände bleiben erhalten:
// v1 (coins, lv, best, wins): Rekord und Siege gelten für Strecke 1, wer dort schon gewonnen hat, hat Strecke 2 frei.
// v2 (Strecken) -> v3: Fahrzeuge (SUV ist immer da), Highscore-Liste (leer) und Fahrername kommen dazu.
// v3 -> v4: Upgrades pro Fahrzeug (lvc). Alle schon gekauften Fahrzeuge behalten den bisherigen Ausbau,
//           neu gekaufte starten bei null. lv bleibt als Spiegel des SUV für ältere Versionen erhalten.
// v4 -> v5: zwei neue Strecken (Dschungel, Mond) – tr wird aufgefüllt, wer Strecke 3 gewonnen hat, bekommt Strecke 4 frei.
//           Neu: music (Musik an/aus, Standard an). Alles andere bleibt unverändert.
function migrate(s) {
  const n = x => (typeof x === 'number' && isFinite(x) && x > 0 ? x : 0);
  const out = { v: 5, music: s.music !== false, coins: Math.floor(n(s.coins)), lv: {}, lvc: {}, best: n(s.best), wins: Math.floor(n(s.wins)), tr: [], unlocked: 1, track: 0, car: 'suv', cars: ['suv'], hs: [], name: 'Fahrer' };
  for (const u of UP) out.lv[u.k] = Math.min(MAX, Math.floor(n(s.lv && s.lv[u.k])));
  for (let i = 0; i < N_TRACKS; i++) { const t = (Array.isArray(s.tr) && s.tr[i]) || {}; out.tr.push({ best: n(t.best), wins: Math.floor(n(t.wins)) }); }
  if (!(s.v >= 2)) { out.tr[0].best = Math.max(out.tr[0].best, out.best); out.tr[0].wins = Math.max(out.tr[0].wins, out.wins); }
  out.unlocked = clampI(Math.floor(n(s.unlocked)) || 1, 1, N_TRACKS);
  for (let i = 0; i < N_TRACKS - 1; i++) if (out.tr[i].wins > 0) out.unlocked = Math.max(out.unlocked, i + 2);
  out.track = clampI(Math.floor(n(s.track)), 0, out.unlocked - 1);
  out.best = out.tr[0].best; out.wins = out.tr[0].wins;   // Spiegel für ältere Versionen
  if (Array.isArray(s.cars)) for (const k of s.cars) if (VEH.some(v => v.k === k) && !out.cars.includes(k)) out.cars.push(k);
  if (out.cars.includes(s.car)) out.car = s.car;
  if (typeof s.name === 'string' && s.name.trim()) out.name = s.name.trim().slice(0, 14);
  if (Array.isArray(s.hs)) for (const e of s.hs) {
    if (!e || !(n(e.p) > 0)) continue;

// Glatter Körper aus Superellipsen-Querschnitten (Spline entlang z):
// st = [[z, cx, halbeBreite, Höhe oben, Höhe unten, cy, Exponent(2 = rund, 4+ = kantig)], ...]
function seLoft(st, nz = 40, nt = 32, caps = false) {
  st = st.slice().sort((a, b) => a[0] - b[0]);
  const tabs = [1, 2, 3, 4, 5, 6].map(k => st.map(s => [s[0], s[k]]));
  const z0 = st[0][0], z1 = st[st.length - 1][0], pos = [], uv = [], idx = [];
  for (let i = 0; i <= nz; i++) {
    const f = i / nz, z = z0 + (z1 - z0) * (0.5 - 0.5 * Math.cos(f * Math.PI));   // an den Enden dichter
    const [cx, w, ht, hb, cy, n] = tabs.map(tb => cr(tb, z)), e = 2 / Math.max(1.6, n);
    for (let j = 0; j <= nt; j++) {
      const a = -Math.PI / 2 + j / nt * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      pos.push(cx + Math.max(w, 0.002) * Math.sign(ca) * Math.pow(Math.abs(ca), e), cy + (sa >= 0 ? ht : hb) * Math.sign(sa) * Math.pow(Math.abs(sa), e), z);
      uv.push(j / nt, f);

  for (let i = 0; i < nz; i++) for (let j = 0; j < nt; j++) { const a = i * (nt + 1) + j, b = a + nt + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  if (caps) for (const [i, zz, flip] of [[0, z0, true], [nz, z1, false]]) {
    const c = pos.length / 3, [cx, , , , cy] = tabs.map(tb => cr(tb, zz)); pos.push(cx, cy, zz); uv.push(0.5, i / nz);
    for (let j = 0; j < nt; j++) { const a = i * (nt + 1) + j; flip ? idx.push(c, a + 1, a) : idx.push(c, a, a + 1); }
  }

function airfoil(chord, th, span, camber = 0.05) {
  return cached(['af', chord, th, span, camber].join(), () => {
    const N = 18, up = [], lo = [];
    for (let k = 0; k <= N; k++) {
      const x = (1 - Math.cos(k / N * Math.PI)) / 2, yt = 5 * th * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4), yc = camber * 4 * x * (1 - x);

    const p = z / GOAL, k = r();
    let kind = 'coins';
    for (const [ty, th] of MIX[trackIdx]) { if (k < th && !((ty === 'wall' || ty === 'icicle' || ty === 'log' || ty === 'boulder') && p <= 0.12)) { kind = ty; break; } }
    switch (kind) {
      case 'crate': { const n = 1 + Math.floor(r() * (1 + p * 3 * D)); for (let i = 0; i < n; i++) add('crate', rx(), z + r() * 4); break; }
      case 'barrel': { const n = 1 + Math.floor(r() * (1 + p * 2.5 * D)); for (let i = 0; i < n; i++) add('barrel', rx(), z + r() * 4); break; }

      case 'boost': { const x = rx(2.5); add('boost', x, z); for (let i = 0; i < 5; i++) add('coin', x, z + 8 + i * 3); z += 14; break; }
      case 'crater': { add('crater', rx(2.5), z); if (r() < 0.5) add('crater', rx(2.5), z + 12 + r() * 6); z += 8; break; }
      case 'ramp': {

        else for (let i = 0; i < 4; i++) add('coin', x, z + 10 + i * 3);

      case 'ice': { const hw = 3 + r() * 2.5, hd = 5 + r() * 5; add('ice', rx(hw * 0.5), z + hd, { hw, hd }); if (r() < 0.5) add('barrel', rx(), z + hd * 2 + 4); z += hd * 2; break; }

function disposeWorld() {

    if (o.geometry && !KEEP.has(o.geometry)) o.geometry.dispose();
    if (o.isInstancedMesh && o.dispose) o.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      ['map', 'bumpMap', 'roughnessMap', 'alphaMap', 'normalMap'].forEach(k => { if (m[k] && !KEEP.has(m[k])) tex.add(m[k]); });
      if (!KEEP.has(m)) m.dispose();

  });
  tex.forEach(x => x.dispose());

}

    MUS.key = key; MUS.song = COMPILED[key.startsWith('race') ? 'race' : 'menu']; MUS.step = 0; MUS.next = now + 0.08;
    MUS.cfg = key.startsWith('race') ? TRACK_MUS[trackIdx] || TRACK_MUS[0] : { tr: 0, bpm: SONGS.menu.bpm };
    BUS.wet.gain.setTargetAtTime(MUS.cfg.wet || 0, now, 0.3);
  }
  if (MUS.next < now - 0.25) MUS.next = now + 0.05;   // nach Hängern nicht nachholen
  const C = MUS.cfg, spb = 60 / C.bpm / 4, out = BUS.music;
  while (MUS.next < now + 0.2) {
    const t = MUS.next, evs = MUS.song.ev[MUS.step] || [];
    for (const e of evs) {
      if (e.c === 'L') {
        tone(t, e.m + C.tr, e.d * spb, C.leadWave || BUS[C.duty || 'p25'], C.leadWave ? 0.2 : 0.11, out, { vib: true, sus: 0.8 });
        if (e.echo) tone(t + spb * 3, e.m + C.tr, e.d * spb, BUS.p12, 0.035, out, { sus: 0.7 });
      } else if (e.c === 'B') tone(t, e.m + C.tr, e.d * spb * 0.92, 'triangle', 0.3, out, { att: 0.002, sus: 0.9, dec: 0.2 });
      else if (e.c === 'A') tone(t, e.m + C.tr + (C.arpUp || 0), e.d * spb * 0.8, BUS.p12, 0.032, out, { sus: 0.5, dec: 0.04 });
      else if (e.c === 'D') drum(t, C.toms && e.k === 'h' && (MUS.step & 7) === 6 ? 't' : e.k, out);
    }
    MUS.next += spb; MUS.step++;
    if (MUS.step >= MUS.song.len) MUS.step = MUS.song.loop;
  }
}
// ---------- Soundeffekte ----------
function sfx(n, v = 1) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + 0.01, o = BUS.sfx, P = BUS;
  const run = (notes, step, wave, vol, opt) => notes.forEach((m, i) => m !== null && tone(t + i * step, m, step * 1.05, wave, vol * v, o, opt));
  switch (n) {
    case 'coin': run([83, 88], 0.06, P.p50, 0.07); break;
    case 'fuel': run([72, 76, 79, 84], 0.05, P.p25, 0.07); break;
    case 'hit': drum(t, 'x', o, 0.7 * v); tone(t, 45, 0.18, P.p50, 0.12 * v, o, { slide: -14 }); break;
    case 'bump': drum(t, 's', o, 0.6 * v); break;
    case 'crash': drum(t, 'x', o, 1.2 * v); tone(t, 40, 0.4, P.p50, 0.14 * v, o, { slide: -20 }); break;
    case 'scrape': drum(t, 'h', o, 1.6 * v); drum(t + 0.05, 'h', o, 1.2 * v); break;
    case 'jump': tone(t, 60, 0.18, P.p25, 0.08 * v, o, { slide: 12 }); break;
    case 'land': drum(t, 'k', o, 0.9 * v); break;
    case 'boost': tone(t, 55, 0.35, P.p25, 0.08 * v, o, { slide: 24 }); tone(t, 62, 0.35, P.p12, 0.05 * v, o, { slide: 24 }); break;
    case 'drift1': run([79], 0.08, P.p12, 0.06); break;
    case 'drift2': run([79, 86], 0.06, P.p12, 0.06); break;
    case 'drift3': run([79, 86, 91], 0.05, P.p12, 0.07); break;
    case 'near': run([88, 91], 0.04, P.p12, 0.05); break;
    case 'oil': tone(t, 70, 0.3, P.p50, 0.06 * v, o, { slide: -10 }); break;
    case 'warn': run([81, null, 81], 0.07, P.p50, 0.06); break;
    case 'meteor': drum(t, 'x', o, 1.4 * v); tone(t, 36, 0.6, 'triangle', 0.3 * v, o, { slide: -12 }); break;
    case 'win': MUS.hold = ac.currentTime + 2.6; run([62, 66, 69, 74, null, 69, 74, null, 78], 0.11, P.p25, 0.12, { vib: true }); run([50, 50, 57, 57, 62, 62, 62, 62, 62], 0.11, 'triangle', 0.3); break;
    case 'lose': MUS.hold = ac.currentTime + 2.4; run([69, 68, 67, 66, null, 62, 61, null, 50], 0.14, P.p25, 0.11, { vib: true }); break;
    case 'go': run([69, null, 69, null, 81], 0.12, P.p50, 0.09); break;
    case 'buy': run([76, 79, 84], 0.06, P.p25, 0.08); break;
  }
}

function setSheet(id, html) { const el = $(id); el.innerHTML = '<div class="fit">' + html + '</div>'; fitSheet(el); return el; }
function fitSheet(el) {
  const f = el.firstElementChild; if (!f || el.classList.contains('hide')) return;
  el.classList.remove('scroll'); f.style.zoom = ''; el.scrollTop = 0;
  let z = 1;
  for (let k = 0; k < 4; k++) {
    const cs = getComputedStyle(el), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), need = el.scrollHeight - pad, have = el.clientHeight - pad;
    if (need <= have + 1) break;
    z = Math.max(0.5, z * have / need * 0.995); f.style.zoom = z;
    if (z <= 0.5) break;
  }
  if (el.scrollHeight > el.clientHeight + 1) el.classList.add('scroll');   // nur im Notfall (winziger Bildschirm)
}

function resetCourse() {

  objs.forEach(o => { o.active = true; o.mesh.visible = true; o.mesh.position.y = o.by; o.told = false; o.passed = false; o.roll = false; o.x = o.x0; o.mesh.position.x = o.x0; o.mesh.rotation.z = 0; });

function backToMenus(n) { $('result').classList.add('hide'); state = 'garage'; resetCar(); resetCourse(); showScreen(n); }
function endRun(reason) {
  state = 'over';
  const dist = Math.min(GOAL, car.z), won = reason === 'ziel';
  const distCoins = Math.round((Math.floor(dist / 10) + Math.floor(Math.pow(dist / 400, 2) * 10)) * TRK.coinMul);  // weiter = überproportional mehr, spätere Strecken mehr
  const bonus = won ? TRK.bonus : 0, pax = Math.round((distCoins + car.coins + bonus) * ((vehOf(save.car).coinMul || 1) - 1));   // Bus: Fahrgäste zahlen mit
  const total = distCoins + car.coins + bonus + pax, tr = save.tr[trackIdx];
  const rec = dist > tr.best;
  let unlock = -1;
  save.coins += total; if (rec) tr.best = dist;
  if (won) { tr.wins++; if (trackIdx + 1 < TRACKS.length && save.unlocked < trackIdx + 2) { save.unlocked = trackIdx + 2; unlock = trackIdx + 1; } }
  save.best = save.tr[0].best; save.wins = save.tr[0].wins;   // Spiegel für ältere Versionen
  // Highscore
  const pts = Math.round(dist * TRK.coinMul) + car.coins * 10 + car.style + (won ? 1000 * (trackIdx + 1) + Math.round(Math.max(0, car.hp) / S.hp * 500) : 0);
  const prevTop = (save.hs.find(e => e.t === trackIdx) || { p: 0 }).p;
  let rank = 0;
  if (pts > 0) {
    const entry = { p: pts, t: trackIdx, v: save.car, m: Math.round(dist), w: won, n: save.name, d: new Date().toLocaleDateString('de-DE') };
    save.hs.push(entry); save.hs = pruneHs(save.hs);
    rank = save.hs.filter(e => e.t === trackIdx).indexOf(entry) + 1;
    lastHs = rank ? entry : null;
  }
  store();
  const titles = { ziel: '🏆 Im Ziel!', schrott: '💥 Totalschaden!', sprit: '⛽ Tank leer!' };
  showMsg(titles[reason], 1.6); sfx(won ? 'win' : 'lose'); car.drift = 0; car.boost = 0; $('speedfx').style.opacity = '0';
  setTimeout(() => {
    ['hud', 'speed', 'ctrlL', 'ctrlR', 'pauseBtn', 'muteBtn'].forEach(id => $(id).classList.add('hide'));
    $('result').classList.remove('hide'); screen = 'result';
    setSheet('result', `<div class="cols"><div><h1>${titles[reason]}</h1>
      <div class="sub">${TRK.ic} ${TRK.name}: ${Math.round(dist)} m von ${GOAL} m${rec ? ' · 🎉 Neuer Rekord!' : ''}</div>
      <div class="res">Strecke <b>+${distCoins} 🪙</b><br>Eingesammelt <b>+${car.coins} 🪙</b>${won ? '<br>Ziel-Bonus <b>+' + bonus + ' 🪙</b>' : ''}${pax ? '<br>Fahrgäste 🚌 <b>+' + pax + ' 🪙</b>' : ''}
      <hr style="border:0;border-top:1px solid #ddd;margin:4px 0">Gesamt <b class="money">+${total} 🪙</b></div>
      <div class="res" style="margin-top:4px">${car.style ? 'davon Stil ✨ <b>' + car.style.toLocaleString('de-DE') + '</b><br>' : ''}Punkte <b>${pts.toLocaleString('de-DE')}</b></div></div><div>
      ${rank === 1 && pts > prevTop ? `<div class="hsnew">🏅 Neuer Highscore auf ${TRK.ic} ${TRK.name}!</div>` : rank ? `<div class="hsnew">🏅 Platz ${rank} der Bestenliste (${TRK.ic} ${TRK.name})</div>` : ''}
      ${unlock >= 0 ? `<div class="unlock">🔓 Neue Strecke freigeschaltet: <b>${TRACKS[unlock].ic} ${TRACKS[unlock].name}</b></div>` : ''}
      <div class="row2"><button class="go" id="againBtn">🔁 Nochmal</button><button class="go" id="backBtn">🔧 Werkstatt</button></div>
      <div class="row2"><button class="go sec" id="menuBtn">🏠 Menü</button><button class="go sec" id="hsBtn">🏆 Highscores</button></div></div></div>`);
    $('backBtn').onclick = () => backToMenus('garage');
    $('menuBtn').onclick = () => backToMenus('menu');
    $('hsBtn').onclick = () => { hsFilter = trackIdx; backToMenus('scores'); };
    $('againBtn').onclick = () => { $('result').classList.add('hide'); startRun(); };
  }, 1700);
}

function hit(dmg, slow) {
  const V = vehOf(save.car);   // LKW: weniger Schaden, wird kaum abgebremst
  car.hp -= dmg * V.dmg; car.v *= slow === 0 ? 0 : 1 - (1 - slow) * V.push; shake = Math.min(1, 0.3 + dmg / 30); flash();
  for (let i = 0; i < 3; i++) puff(car.x + (Math.random() - 0.5) * 2, 1, car.z + 2, 0x777777);
  if (dmg >= 3) { if (car.combo >= 3) popup('Combo weg 💔', '#ff8a8a'); car.combo = 0; car.drift = 0; car.dl = 0; }
  sfx(dmg >= 10 ? 'crash' : dmg >= 3 ? 'hit' : 'bump');
}
// Stil-Punkte: Knapp vorbei, Drift-Turbo, Sprünge, Boost-Pads. Jede Aktion ohne Treffer erhöht die Combo (×1 … ×5).
const comboMul = () => Math.min(5, 1 + Math.floor(car.combo / 3));
function style(pts, label) {
  car.combo++; car.comboT = 8;
  const p = Math.round(pts * comboMul()); car.style += p;
  popup(label + ' +' + p);
}
let popT = 0;
function popup(txt, col) { const el = $('pop'); el.textContent = txt; el.style.color = col || ''; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); popT = 1.1; }

const JET_ALT = 2.8;   // Flughöhe des Airbus (Rumpfunterkante ~3,4 m: über jedem Hindernis, unter dem Zielportal)
const HAZARD = new Set(['crate', 'barrel', 'wall', 'icicle', 'log', 'boulder', 'moonrock']);
const DRIFT_COL = [0x40c8ff, 0xff9a20, 0xd050ff];
let comboTxt = '';
function update(dt) {
  const c = car, V = vehOf(save.car), G = 25 * (TRK.grav || 1);
  const gas = keys.up && c.fuel > 0, flying = V.fly && c.y > 0.6, onGround = c.y <= 0.01;
  const sl = flying ? 0 : slopeAt(c.z);   // Steigung: bergauf bremst und kostet Sprit, bergab rollt es schneller
  const steerIn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  c.st += (steerIn - c.st) * Math.min(1, dt * (steerIn ? 10 : 14));   // Lenkung: schnell rein, schnell zurück – nie hakelig

  // ---- Drift: Bremse halten + lenken (ab ~50 km/h). Je länger, desto stärker der Turbo beim Loslassen der Bremse.
  if (!c.drift && keys.down && steerIn && c.v > 13 && onGround && c.oil <= 0 && !V.fly) { c.drift = steerIn; c.dtm = 0; c.dl = 0; }
  if (c.drift) {
    if (!keys.down || c.v < 8 || c.y > 1.2) {
      if (!keys.down && c.dl > 0 && c.v >= 8) { c.boost = Math.max(c.boost, [0, 0.7, 1.25, 1.9][c.dl]); sfx('boost'); style(40 * c.dl, ['', 'Mini-Turbo 🔵', 'Super-Turbo 🟠', 'Ultra-Turbo 🟣'][c.dl]); }
      c.drift = 0; c.dl = 0;
    } else {
      c.dtm += dt * (steerIn === c.drift ? 1.3 : steerIn ? 0.55 : 0.9);   // in die Driftrichtung lenken lädt schneller
      const lvl = c.dtm > 2.3 ? 3 : c.dtm > 1.4 ? 2 : c.dtm > 0.6 ? 1 : 0;
      if (lvl > c.dl) { c.dl = lvl; sfx('drift' + lvl); }
    }
  }

  // ---- Längsdynamik
  const boosting = c.boost > 0; if (boosting) c.boost -= dt;
  const vTop = S.maxV * (boosting ? 1.3 : 1);
  if (gas || boosting) c.v += (S.acc + (boosting ? 14 : 0)) * dt * Math.max(0.15, 1 - 0.5 * c.v / vTop);
  if (keys.down && !c.drift) c.v -= (c.ice > 0 ? 9 : 28) * dt;   // auf Eis greifen die Bremsen kaum
  if (c.drift) c.v -= 2.2 * dt;                                    // im Drift kaum Tempoverlust
  if (!gas && !keys.down && !boosting) c.v -= 4 * dt;
  c.v -= 9.81 * 0.85 * sl * dt;
  const vmax = vTop * (1 + Math.max(0, -sl) * 2);
  if (c.v > vmax) c.v = Math.max(vmax, c.v - 8 * dt);
  c.v = Math.max(0, c.v);
  c.fuel = Math.max(0, c.fuel - dt * (gas ? clamp(1 + sl * 3, 0.5, 2) : 0.15));   // bergauf mehr, bergab weniger Sprit

  // ---- Lenken (bei Regen rutschiger)
  const grip = S.grip * TRK.grip * (TRK.rain ? 1 - 0.28 * storm.a : 1), spd = Math.min(1, c.v / 6 + 0.25);
  let target = c.st * grip * spd, resp = onGround ? 11 : TRK.grav ? 5 : 2.5;   // auf dem Mond lässt sich in der Luft gut nachlenken
  if (c.drift) { target = c.drift * grip * 0.6 * spd + c.st * grip * 0.45; resp = 6; }
  if (c.oil > 0) { c.oil -= dt; target = c.vx + Math.sin(performance.now() / 120) * 4; if (onGround) resp = 1; }
  else if (c.ice > 0) { c.ice -= dt; target = c.vx * 0.9 + c.st * grip * 0.35; if (onGround) resp = 0.8; }   // Glatteis: Auto rutscht weiter
  else if (c.mud > 0) { c.mud -= dt; target += Math.sin(t * 11) * 2.2; }
  c.vx += (target - c.vx) * Math.min(1, resp * dt);
  c.x += c.vx * dt;
  const vc = Math.min(c.v, 28);   // Fliehkraft: in Kurven drückt es leicht nach außen (sanft, damit es Spaß macht)
  c.x -= curveAt(c.z) * vc * vc * (flying ? 0.15 : 0.24) * dt;
  // ---- Leitplanke: entlangschrammen statt Crash (nur harte Einschläge kosten etwas Zustand)
  const lim = ROAD - 1.1;

    const s = Math.sign(c.x), into = c.vx * s; c.x = s * lim;

      if (Math.random() < dt * 25) puff(c.x + s * 0.9, 0.5, c.z + 1, 0xffb040);
      if (t - (c.scrT || 0) > 0.3) { sfx('scrape', 0.5); c.scrT = t; }
    }
    c.vx = -s * Math.min(Math.abs(c.vx) * 0.25, 2);
  }
  c.z += c.v * dt;

  // ---- Rollende Felskugeln (Dschungel): setzen sich in Bewegung, wenn man näher kommt, und pendeln über die Straße
  for (let i = c.lo; i < objs.length && objs[i].z < c.z + 90; i++) {
    const o = objs[i]; if (!o.vx || !o.active) continue;
    if (!o.roll) { if (o.z - c.z < 75) o.roll = true; else continue; }
    o.x += o.vx * dt; if (Math.abs(o.x) > ROAD - 1.3) { o.x = Math.sign(o.x) * (ROAD - 1.3); o.vx = -o.vx; puff(o.x, 0.4, o.z, 0x7a6a50); }
    o.mesh.position.x = o.x; o.mesh.rotation.z -= o.vx * dt / 1.25;
  }

  // ---- Boden / Rampen / Kollisionen
  let gh = 0, onRamp = false;
  while (c.lo < objs.length && objs[c.lo].z < c.z - 12) c.lo++;
  for (let i = c.lo; i < objs.length && objs[i].z < c.z + 6; i++) {
    const o = objs[i]; if (!o.active) continue;
    // Knapp vorbei: Hindernis passiert, ohne es zu berühren
    if (HAZARD.has(o.type) && !o.passed && o.z + o.hd < c.z - 1.5) {
      o.passed = true;
      if (!flying && c.v > 10 && c.y < o.h && Math.abs(c.x - o.x) - o.hw - 1.0 < 1.4) { c.coins += TRK.coinVal; style(50, 'Knapp! 😎'); sfx('near'); }
    }
    if (Math.abs(c.x - o.x) > o.hw + 1.0 || Math.abs(c.z - o.z) > o.hd + 2.0) continue;
    if (flying && o.type !== 'coin' && o.type !== 'fuel') continue;   // Airbus fliegt über alles drüber
    if (o.type === 'ramp') {

      continue;
    }
    if (c.y > o.h - 0.1 && o.type !== 'coin' && o.type !== 'fuel') continue;  // drübergesprungen
    switch (o.type) {
      case 'coin': c.coins += TRK.coinVal; o.active = false; o.mesh.visible = false; sfx('coin'); break;
      case 'fuel': c.fuel = Math.min(S.fuel, c.fuel + 7); o.active = false; o.mesh.visible = false; showMsg('+ Sprit ⛽', 0.8); sfx('fuel'); break;
      case 'oil': if (onGround && c.oil <= 0) { c.oil = 1.2; c.drift = 0; showMsg('Öl! 🛢️', 0.7); sfx('oil'); } break;
      case 'ice':
        if (onGround) { if (c.ice <= 0) { c.vx += (Math.random() - 0.5) * 6; showMsg('Glatteis! ❄️', 0.8); sfx('oil'); } c.ice = 0.45; }
        break;
      case 'sand': case 'snow':   // Verwehung bremst kräftig
        if (onGround) {
          c.v *= Math.pow(o.type === 'sand' ? 0.3 : 0.22, dt);
          if (!o.told) { o.told = true; showMsg(o.type === 'sand' ? 'Sandverwehung! 🏜️' : 'Schneewehe! ❄️', 0.8); }
          if (Math.random() < dt * 25) puff(c.x + (Math.random() - 0.5) * 2, 0.4, c.z + 1.8, o.type === 'sand' ? 0xd9b47a : 0xf4f8fc);
        }
        break;
      case 'mud':
        if (onGround) {
          c.v *= Math.pow(0.4, dt); c.mud = 0.35;
          if (!o.told) { o.told = true; showMsg('Schlamm! 🟫', 0.8); }
          if (Math.random() < dt * 30) puff(c.x + (Math.random() - 0.5) * 2, 0.4, c.z - 1.5, 0x5a3a20);
        }
        break;
      case 'boost':
        if (onGround) { c.boost = Math.max(c.boost, 1.3); if (!o.told) { o.told = true; sfx('boost'); style(20, 'Boost! ⚡'); } }
        break;
      case 'crater':   // Krater: wirft das Auto in die Luft (auf dem Mond ein Riesensatz)
        if (onGround && !o.told) { o.told = true; c.vy = 3 + c.v * 0.12; c.y = 0.02; c.hp -= 1 * V.dmg; shake = 0.35; sfx('jump'); showMsg('Krater! 🌑', 0.7); }
        break;
      case 'icicle': hit(8 + c.v * 0.6, 0.4); o.active = false; o.mesh.visible = false; for (let k = 0; k < 5; k++) puff(o.x + (k - 2) * 0.6, 0.9, o.z, 0xcdeaf7); showMsg('Eiszapfen! 🧊', 0.8); break;
      case 'cone': hit(1, 0.93); o.active = false; o.mesh.visible = false; break;
      case 'crate': hit(4 + c.v * 0.25, 0.6); o.active = false; o.mesh.visible = false; break;
      case 'moonrock': hit(5 + c.v * 0.3, 0.6); o.active = false; o.mesh.visible = false; for (let k = 0; k < 4; k++) puff(o.x, 0.8, o.z, 0x9a9994); break;
      case 'barrel': hit(6 + c.v * 0.3, 0.6); o.active = false; o.mesh.visible = false; for (let k = 0; k < 4; k++) puff(o.x, 1, o.z, 0xff7b00); break;
      case 'log': hit(6 + c.v * 0.45, 0.45); o.active = false; o.mesh.visible = false; for (let k = 0; k < 5; k++) puff(c.x + (k - 2), 0.8, o.z, 0x7a5a38); showMsg('Baumstamm! 🪵', 0.8); break;
      case 'boulder': hit(10 + c.v * 0.4, 0.35); o.active = false; o.mesh.visible = false; for (let k = 0; k < 6; k++) puff(o.x + (Math.random() - 0.5) * 2, 1, o.z, 0x8a8a78); showMsg('Felskugel! 🪨', 0.8); break;
      case 'wall':
        if (o.brk) { hit(10 + c.v * 0.7, 0.3); o.active = false; o.mesh.visible = false; for (let k = 0; k < 5; k++) puff(c.x + (k - 2), 1, o.z, 0xa0692f); showMsg('Durchgebrochen! 💥', 0.8); }
        else { hit(6 + c.v * 0.9, 0); c.z = o.z - o.hd - 2.05; showMsg('KRACH! 💥', 0.8); }
        break;
    }
  }
  const wasAir = c.y > 0.05;
  if (V.fly && (c.v > 13 || c.y > 0.05)) {   // Airbus: ab ~50 km/h abheben, beim Langsamwerden sanft landen
    const tgt = clamp((c.v - 13) / 5, 0, 1) * JET_ALT, was = c.y;
    c.y += (tgt - c.y) * Math.min(1, dt * 1.6); c.vy = (c.y - was) / dt;
    if (was <= 0.6 && c.y > 0.6) { showMsg('Abheben! ✈️', 1); sfx('boost'); }
    if (c.y < 0.02 && tgt === 0) { c.y = 0; c.vy = 0; }
  } else if (c.y <= gh + 0.01 && c.vy <= c.v * 0.28 + 0.01) {
    c.y = gh; c.vy = onRamp ? c.v * 0.28 : 0;
  } else {
    c.vy -= G * dt; c.y += c.vy * dt;
    if (c.y < gh) { if (c.vy < -14) hit(3, 0.95); c.y = gh; c.vy = 0; }
  }
  // ---- Sprünge: Absprung-Sound, Landung mit Stil-Punkten und kleinem Turbo
  if (onRamp) c.ramp = true;
  else if (c.ramp && c.y > gh + 0.05) { c.ramp = false; sfx('jump'); }
  if (!V.fly) {
    if (c.y > 0.05) c.air += dt;
    else if (wasAir || c.air > 0) {
      if (c.air > 0.7) { const big = c.air > 2; c.boost = Math.max(c.boost, big ? 0.9 : 0.5); style(Math.round(50 + c.air * 30), big ? 'Mondsprung! 🌕' : 'Sauber gelandet! 🛬'); sfx('land'); }
      else if (c.air > 0.2) sfx('land', 0.6);
      c.air = 0; c.ramp = false;
    }
  }
  if (c.comboT > 0 && (c.comboT -= dt) <= 0 && c.combo) { c.combo = 0; }
  if (!c.tip && c.z > 70 && save.tr.reduce((a, r) => a + r.wins, 0) < 3) { c.tip = true; popup('Tipp: Bremse halten + lenken = Drift-Turbo 🔵🟠🟣', '#9ff6ff'); }

  // ---- Darstellung
  const yawT = c.drift ? c.drift * 0.38 + c.st * 0.12 : c.vx * (c.ice > 0 ? 0.07 : 0.035);
  c.yaw += (yawT - c.yaw) * Math.min(1, dt * 8);
  carMesh.position.set(c.x, c.y, c.z);
  carMesh.rotation.y = c.yaw + (c.oil > 0 ? Math.sin(performance.now() / 90) * 0.3 : 0);
  carMesh.rotation.x = V.fly ? -clamp(c.vy * 0.06, -0.12, 0.2) : onRamp ? -0.28 : (c.y > 0.05 ? clamp(-c.vy * 0.015, -0.25, 0.25) : 0);
  if (carMesh.userData.gear) carMesh.userData.gear.visible = c.y < 0.9;   // Fahrwerk einfahren
  animateCar(dt, c.v, c.st, gas, keys.down && !c.drift, c.drift ? c.drift : 0);
  if (c.drift && onGround) {   // Reifenqualm und Funken in der Farbe der Turbo-Stufe
    for (const sx of [-0.8, 0.8]) if (Math.random() < dt * 22) puff(c.x + sx, 0.35, c.z - 1.4, 0xb8b8b8);
    if (c.dl && Math.random() < dt * 30) puff(c.x + (Math.random() < 0.5 ? -0.85 : 0.85), 0.25, c.z - 1.2, DRIFT_COL[c.dl - 1]);
  }
  if (boosting && Math.random() < dt * 40) puff(c.x + (Math.random() - 0.5) * 0.6, c.y + 0.45, c.z - 2.3, Math.random() < 0.5 ? 0xff8a20 : 0x40c8ff);
  $('speedfx').style.opacity = boosting ? Math.min(1, c.boost * 2).toFixed(2) : '0';

  if (c.hp < S.hp * 0.35 && Math.random() < dt * 15) puff(c.x, c.y + 1.2, c.z + 1.5, 0x333333);
  if (save.car === 'suv' && tier() === 0 && gas && Math.random() < dt * 6) puff(c.x + 0.5, c.y + 0.5, c.z - 2.2, 0x888888); // Schrott qualmt
  if (save.car === 'lkw' && gas && Math.random() < dt * (tier() === 0 ? 10 : 4)) puff(c.x + 0.98, c.y + 3.4, c.z + 1.25, 0x3a3a3a); // Auspuff-Ruß

  // HUD
  $('distTxt').textContent = Math.round(c.z) + ' / ' + GOAL + ' m';
  $('progFill').style.width = Math.min(100, c.z / GOAL * 100) + '%';
  $('hpFill').style.width = Math.max(0, c.hp / S.hp * 100) + '%';
  $('fuelFill').style.width = c.fuel / S.fuel * 100 + '%';
  $('coinsRun').textContent = '🪙 ' + c.coins;
  $('speed').innerHTML = Math.round(c.v * 3.6) + ' <small>km/h</small>';
  const ct = c.combo ? `COMBO ×${comboMul()} · ✨ ${c.style}` : c.style ? `✨ ${c.style}` : '';
  if (ct !== comboTxt) { comboTxt = ct; $('combo').textContent = ct; $('combo').classList.toggle('hot', comboMul() >= 3); }

  if (c.z >= GOAL) endRun('ziel');
  else if (c.hp <= 0) endRun('schrott');
  else if (c.fuel <= 0 && c.v < 0.3 && c.vy === 0) endRun('sprit');   // auch wenn das Auto auf einer Rampe stehen bleibt
}

// ---------- Loop ----------
const clock = new THREE.Clock();
let t = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  engineSound(); musicTick();
  if (paused) { renderer.render(scene, camera); return; }   // eingefroren, Zeit läuft nicht weiter
  t += dt;
  if (state === 'run') update(dt);
  else if (state === 'over') { car.v *= Math.pow(0.3, dt); car.z += car.v * dt; carMesh.position.z = car.z; }

  updateStorm(dt); updateSnow(dt); updateMeteors(dt);
  if (waterFx) waterFx.offset.y = -t * 0.08;
  OT.boost.offset.y = -t * 1.5;
  if (shimmerBand) { shimmerU.value = t; shimmerBand.material.map.offset.x = t * 0.004; shimmerBand.scale.y = 1 + Math.sin(t * 9) * 0.06; }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').textContent = ''; }

  // Münzen drehen
  for (let i = car.lo || 0; i < objs.length && objs[i].z < (car.z || 0) + 120; i++) {
    const o = objs[i]; if (o.type === 'coin' || o.type === 'fuel') { o.mesh.rotation.y = t * 3; o.mesh.position.y = o.by + Math.sin(t * 3 + o.z) * 0.15; }
  }
  smoke.forEach(s => { if (s.life > 0) { s.life -= dt * 1.2; s.m.position.y += dt * 1.5; s.m.scale.multiplyScalar(1 + dt * 1.5); s.m.material.opacity = Math.max(0, s.life * 0.6); } });

  updateBend(carMesh.position.z);
  setGarageView(state === 'garage');
  if (state === 'garage') {
    const a = t * 0.4;
    const port = camera.aspect < 1, k = vehOf(save.car).show, d = (port ? 10.5 : 7.2 * (1 + Math.max(0, viewOff) / (renderer.domElement.clientWidth || innerWidth) * 1.5)) * k;   // Querformat: Auto kleiner, es hat nur links Platz   // Hochformat: weiter weg, Auto über dem Werkstatt-Panel
    camera.position.set(Math.sin(a) * d, (port ? 3.2 : 2.4) * k, Math.cos(a) * d);
    camera.lookAt(0, (port ? -3.4 : -1.3) * k + (k - 1) * 1.2, 0);
    carMesh.position.set(0, 0, 0); carMesh.rotation.set(0, 0, 0); animateCar(dt, 0, 0, false, false, 0);
  } else {
    shake *= Math.pow(0.02, dt);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    const cam = vehOf(save.car).cam;   // [Höhe, Abstand, Blickhöhe] je Fahrzeug
    camera.position.lerp(new THREE.Vector3(...bendOff(car.x * 0.6 + sx, cam[0] + car.y * 0.5 + sy, car.z - cam[1])), 1 - Math.exp(-8 * dt));
    camera.lookAt(...bendOff(car.x * 0.8, cam[2] + car.y * 0.6, car.z + 8));   // Kamera folgt Berg und Tal
  }
  // Tempogefühl: Blickwinkel weitet sich mit dem Tempo und beim Turbo
  const fovT = state === 'garage' ? 65 : 65 + clamp((car.v || 0) * 0.2, 0, 10) + (car.boost > 0 ? 8 : 0);
  if (Math.abs(camera.fov - fovT) > 0.05) { camera.fov += (fovT - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
  if (state === 'over') animateCar(dt, car.v, 0, false, true, 0);
  shadow.position.set(carMesh.position.x, 0.035, carMesh.position.z);
  shadow.rotation.z = -carMesh.rotation.y;
  const shs = vehOf(save.car).shadow; shadow.scale.set(shs[0], shs[1], 1);
  shadow.material.opacity = Math.max(0.25, 1 - carMesh.position.y * 0.15);
  skyDome.position.copy(camera.position); farGroup.position.set(camera.position.x, 0, camera.position.z);
  const cz = carMesh.position.z; for (const o of objs) o.mesh.visible = o.active && o.z > cz - 16 && o.z < cz + 260;   // nur nahe Hindernisse zeichnen
  sun.position.set(carMesh.position.x + 40, 100, carMesh.position.z - 30); sun.target.position.copy(carMesh.position);
  renderer.render(scene, camera);
}
// Querformat-Menüs liegen rechts: Bild so verschieben, dass das Auto links in der freien Fläche steht
function setGarageView(on) {
  let off = 0;
  if (on && camera.aspect > 1) { const sh = SHEETS.map($).find(e => !e.classList.contains('hide')); if (sh) off = Math.round((sh.offsetWidth + 8) / 2); }
  if (off === viewOff) return; viewOff = off;
  const c = renderer.domElement, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
  if (off) camera.setViewOffset(w, h, off, 0, w, h); else camera.clearViewOffset();
}
function linearizeScene() {
  scene.traverse(o => {
    if (o.isLight && !o.userData.lin) { o.userData.lin = true; o.color.convertSRGBToLinear(); if (o.groundColor) o.groundColor.convertSRGBToLinear(); }
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.userData.lin) return; m.userData.lin = true;
      ['color', 'emissive', 'specular'].forEach(k => { if (m[k] && m[k].isColor) m[k].convertSRGBToLinear(); });
      if (m.map && !m.map._lin) { m.map.encoding = THREE.sRGBEncoding; m.map._lin = true; m.map.needsUpdate = true; }
      m.needsUpdate = true;
    });
  });
}
