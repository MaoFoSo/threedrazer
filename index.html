<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc8ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  .hide{display:none!important}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));color:#fff;font-weight:800;text-shadow:0 2px 5px #000a;pointer-events:none}
  #progWrap{background:#0005;border-radius:10px;padding:6px 10px}
  #progBar{height:10px;background:#fff3;border-radius:5px;overflow:hidden;margin-top:4px}

  #flash{position:fixed;inset:0;background:#f003;opacity:0;pointer-events:none;transition:opacity .3s}
  #msg{position:fixed;left:0;right:0;top:38%;text-align:center;color:#fff;font-size:42px;font-weight:900;text-shadow:0 4px 12px #000c;pointer-events:none}
  .ctrl{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));display:none;gap:12px}
  #ctrlL{left:calc(14px + env(safe-area-inset-left))} #ctrlR{right:calc(14px + env(safe-area-inset-right))}
  .ctrl button{width:74px;height:74px;border-radius:50%;border:3px solid #fff8;background:#0005;color:#fff;font-size:24px;font-weight:900;touch-action:none}
  .ctrl button.on{background:#fff6}
  #pauseBtn,#muteBtn{position:fixed;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:3px solid #fff8;background:#0005;color:#fff;font-size:15px;font-weight:900;display:none;touch-action:none;padding:0}

  #pause .t{font-size:56px;font-weight:900;text-shadow:0 4px 12px #000c}
  #pause button{font-size:20px;font-weight:900;padding:12px 28px;border:0;border-radius:14px;background:#e63946;color:#fff}

  .dots i.f{background:#06d6a0}
  .up button{border:0;border-radius:10px;padding:9px 10px;font-weight:800;background:#ffd166;color:#333;min-width:86px;font-size:14px}
  .up button:disabled{background:#eee;color:#aaa}

<body>
<div id="hud" class="hide">
  <div id="progWrap"><span id="distTxt">0 / 2000 m</span><div id="progBar"><div id="progFill"></div></div></div>
  <div id="row">
    <div class="bar">❤️ Zustand<div class="b"><div id="hpFill"></div></div></div>
    <div class="bar">⛽ Sprit<div class="b"><div id="fuelFill"></div></div></div>

<script src="vendor/three.min.js"></script>
<script>
const GOAL = 2000, ROAD = 8;   // Streckenlänge (m), halbe Straßenbreite
const $ = id => document.getElementById(id);

// ---------- Speicherstand ----------
const UP = [
  { k: 'motor', name: 'Motor', ic: '🔧', ds: 'Höchstgeschwindigkeit', base: 50 },
  { k: 'accel', name: 'Getriebe', ic: '⚙️', ds: 'Beschleunigung', base: 40 },
  { k: 'grip',  name: 'Reifen', ic: '🛞', ds: 'Lenkung & Grip', base: 30 },
  { k: 'armor', name: 'Panzerung', ic: '🛡️', ds: 'Hält mehr Schaden aus', base: 45 },
  { k: 'tank',  name: 'Tank', ic: '⛽', ds: 'Mehr Sprit', base: 35 },
];
const MAX = 6;
let save = { coins: 0, lv: { motor: 0, accel: 0, grip: 0, armor: 0, tank: 0 }, best: 0, wins: 0 };
const SAVE_KEY = 'threedrazer', MUTE_KEY = 'threedrazer_mute';
// Alten Speicherstand von "Schrott Racer" einmalig übernehmen
try {
  if (localStorage.getItem(SAVE_KEY) === null && localStorage.getItem('schrottracer') !== null)
    localStorage.setItem(SAVE_KEY, localStorage.getItem('schrottracer'));
  if (localStorage.getItem(MUTE_KEY) === null && localStorage.getItem('schrottracer_mute') !== null)
    localStorage.setItem(MUTE_KEY, localStorage.getItem('schrottracer_mute'));
} catch (e) {}
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.lv) save = s; } catch (e) {}
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const cost = u => Math.round(u.base * Math.pow(1.75, save.lv[u.k]));
function stats() {
  const l = save.lv;
  return { maxV: 18 + l.motor * 7, acc: 6 + l.accel * 3.5, grip: 7 + l.grip * 2.6, hp: 40 + l.armor * 25, fuel: 18 + l.tank * 9 };
}
function tier() { const s = Object.values(save.lv).reduce((a, b) => a + b, 0); return s < 5 ? 0 : s < 13 ? 1 : s < 22 ? 2 : 3; }
const TIER_NAMES = ['Schrotthaufen', 'Gebrauchtwagen', 'Sportpaket', 'Vollausstattung'];

// ---------- Szene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8ef);
scene.fog = new THREE.Fog(new THREE.Color(0xd3e1ef).convertSRGBToLinear(), 110, 430);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.HemisphereLight(0xdbe8ff, 0x5d6b47, 0.5));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.35); sun.position.set(40, 100, -30); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
{ const sc = sun.shadow.camera; sc.left = -6; sc.right = 6; sc.top = 6; sc.bottom = -6; sc.near = 50; sc.far = 180; }
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
const fill = new THREE.DirectionalLight(0xcfe2ff, 0.35); fill.position.set(-60, 40, 80); scene.add(fill);

// Zufall mit Seed -> Strecke ist jedes Mal gleich
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ===================== Auto: hochdetailliertes SUV-Coupé (eigenes Design) =====================
const QUAL = (typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches) ? 0.7 : 1;
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const std = o => { const m = new THREE.MeshStandardMaterial(o); m.userData.lin = true; return m; };
const phys = o => { const m = new THREE.MeshPhysicalMaterial(o); m.userData.lin = true; return m; };
function cvs(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d', { willReadFrequently: true }), w, h); return c; }
function ctex(c, srgb = true, rep) {
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8; t._lin = true;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function noiseCanvas(size, fn) { return cvs(size, size, (g, w, h) => { const id = g.createImageData(w, h); for (let i = 0; i < w * h; i++) fn(id.data, i * 4); g.putImageData(id, 0, 0); }); }

// ---------- Umgebung für Spiegelungen (Himmel, Sonne, Lichtstreifen, Baumreihe) ----------
if (typeof renderer !== 'undefined' && renderer && renderer.isWebGLRenderer) {
  const es = new THREE.Scene();
  const sg = new THREE.SphereGeometry(50, 64, 32), pa = sg.attributes.position, cols = [];
  const zen = new THREE.Color(0.08, 0.22, 0.6), hor = new THREE.Color(0.85, 0.92, 1.0), gnd = new THREE.Color(0.14, 0.15, 0.12), c = new THREE.Color();
  for (let i = 0; i < pa.count; i++) {
    const y = pa.getY(i) / 50;
    if (y >= 0) c.copy(hor).lerp(zen, Math.pow(y, 0.55)); else c.copy(hor).multiplyScalar(0.5).lerp(gnd, Math.min(1, -y * 6));
    cols.push(c.r, c.g, c.b);
  }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const sunD = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(40, 36, 30) }));
  sunD.position.set(18, 30, -16); es.add(sunD);
  const panel = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.5, 2.7), side: THREE.DoubleSide });
  [[0, 22, 16, 44, 3], [-24, 15, -8, 3, 32], [26, 11, 6, 3, 26]].forEach(([x, y, z, w, d]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), panel); m.position.set(x, y, z); es.add(m); });
  const trees = new THREE.Mesh(new THREE.CylinderGeometry(44, 44, 6, 64, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.015, 0.04, 0.02), side: THREE.BackSide }));
  trees.position.y = 2; es.add(trees);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(es, 0.03).texture; pm.dispose();
}

// ---------- Texturen ----------
const TX = {
  flake: ctex(noiseCanvas(256, (d, i) => { const a = Math.random() * 6.283, r = Math.pow(Math.random(), 3) * 0.9; d[i] = 128 + Math.cos(a) * r * 127; d[i + 1] = 128 + Math.sin(a) * r * 127; d[i + 2] = 255; d[i + 3] = 255; }), false, [26, 26]),
  grain: ctex(noiseCanvas(256, (d, i) => { const v = 105 + Math.random() * 70; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }), false, [40, 40]),
  honey: ctex(cvs(256, 256, (g) => {
    g.strokeStyle = '#2b2c30'; g.lineWidth = 6; const ry = 256 / 18, dx = 256 / 8, rx = dx / 1.732;
    for (let row = -1; row < 14; row++) for (let col = -1; col < 10; col++) {
      const cx = col * dx + (row % 2 ? dx / 2 : 0), cy = row * ry * 1.5;
      g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); } g.closePath(); g.stroke();
    }
  }), true, [7, 2]),
  disc: ctex(cvs(256, 256, (g) => {
    const gr = g.createRadialGradient(128, 128, 40, 128, 128, 128);
    gr.addColorStop(0, '#4a4b4d'); gr.addColorStop(0.47, '#5d5f62'); gr.addColorStop(0.5, '#8c8e91'); gr.addColorStop(0.96, '#999b9e'); gr.addColorStop(1, '#3a3a3a');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(55,55,55,.35)'; for (let i = 0; i < 220; i++) { g.beginPath(); const r = 66 + Math.random() * 60, a = Math.random() * 6.28; g.arc(128, 128, r, a, a + 0.6); g.stroke(); }
    g.fillStyle = '#1e1e1e'; for (let k = 0; k < 36; k++) { const a = k / 36 * 6.283, r = k % 2 ? 90 : 108; g.beginPath(); g.arc(128 + Math.cos(a) * r, 128 + Math.sin(a) * r, 3.6, 0, 7); g.fill(); }
    g.fillStyle = '#2a2a2a'; g.beginPath(); g.arc(128, 128, 60, 0, 7); g.fill();
  })),
  logo: ctex(cvs(128, 128, (g) => {
    g.fillStyle = '#0c1830'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
    g.strokeStyle = '#dfe4ea'; g.lineWidth = 7; g.beginPath(); g.arc(64, 64, 55, 0, 7); g.stroke();
    g.fillStyle = '#e9edf2'; g.font = 'bold 54px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SR', 64, 67);
  })),
};
const tireCanvas = cvs(2048, 256, (g, w, h) => {
  g.fillStyle = '#171717'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32) {
    g.fillStyle = '#080808';
    g.beginPath(); g.moveTo(x, 94); g.lineTo(x + 6, 94); g.lineTo(x + 18, 122); g.lineTo(x + 12, 122); g.fill();
    g.beginPath(); g.moveTo(x + 18, 134); g.lineTo(x + 24, 134); g.lineTo(x + 12, 162); g.lineTo(x + 6, 162); g.fill();
    g.fillStyle = '#0d0d0d'; g.fillRect(x + 26, 100, 2, 20); g.fillRect(x + 26, 136, 2, 20);
  }
  g.fillStyle = '#050505'; g.fillRect(0, 122, w, 4); g.fillRect(0, 130, w, 4);
  g.fillStyle = '#2e2e2e'; g.font = 'bold 22px Arial'; g.textBaseline = 'middle';
  for (let k = 0; k < 3; k++) { const x0 = k * w / 3; g.fillText('SR ALLGRIP', x0 + 40, 36); g.font = '18px Arial'; g.fillText('235/55 R18  98V  M+S', x0 + 330, 36); g.font = 'bold 22px Arial'; }
  g.strokeStyle = '#232323'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 56); g.lineTo(w, 56); g.stroke(); g.beginPath(); g.moveTo(0, 200); g.lineTo(w, 200); g.stroke();
});
TX.tire = ctex(tireCanvas); TX.tireBump = ctex(tireCanvas, false);
function plateMat(txt) {
  return std({ roughness: 0.4, metalness: 0.1, map: ctex(cvs(512, 112, (g, w, h) => {
    g.fillStyle = '#f2f2ee'; g.fillRect(0, 0, w, h); g.strokeStyle = '#111'; g.lineWidth = 7; g.strokeRect(4, 4, w - 8, h - 8);
    g.fillStyle = '#1f47b8'; g.fillRect(8, 8, 58, h - 16); g.fillStyle = '#fff'; g.font = 'bold 34px Arial'; g.textAlign = 'center'; g.fillText('D', 37, 90);
    g.fillStyle = '#ffd400'; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; g.fillRect(37 + Math.cos(a) * 15 - 2, 40 + Math.sin(a) * 15 - 2, 4, 4); }
    g.fillStyle = '#111'; g.font = 'bold 70px monospace'; g.fillText(txt, 290, 82);
  })) });
}

// ---------- Materialien ----------
const M = {
  clad: std({ color: lin(0x141517), roughness: 0.78, metalness: 0, bumpMap: TX.grain, bumpScale: 0.0012 }),
  cladOld: std({ color: lin(0x2f3033), roughness: 0.92, metalness: 0, bumpMap: TX.grain, bumpScale: 0.002 }),
  skid: std({ color: lin(0xaeb2b7), roughness: 0.36, metalness: 0.8 }),
  gloss: phys({ color: lin(0x050506), roughness: 0.12, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05 }),
  chrome: std({ color: lin(0xf4f4f4), roughness: 0.05, metalness: 1 }),
  satin: std({ color: lin(0xb6bbc1), roughness: 0.3, metalness: 0.9 }),
  machined: std({ color: lin(0xd9dce0), roughness: 0.2, metalness: 1 }),
  gunmetal: std({ color: lin(0x26292d), roughness: 0.38, metalness: 0.8 }),
  silver: std({ color: lin(0xbfc3c8), roughness: 0.34, metalness: 0.85 }),
  steelRim: std({ color: lin(0x1d1d1f), roughness: 0.55, metalness: 0.5 }),
  rustRim: std({ color: lin(0x4a2a17), roughness: 0.9, metalness: 0.2, bumpMap: TX.grain, bumpScale: 0.003 }),
  barrel: std({ color: lin(0x3a3d41), roughness: 0.5, metalness: 0.7, side: THREE.DoubleSide }),
  liner: std({ color: lin(0x080808), roughness: 0.95, side: THREE.DoubleSide }),
  tire: std({ map: TX.tire, bumpMap: TX.tireBump, bumpScale: 0.004, roughness: 0.9, metalness: 0, side: THREE.DoubleSide }),
  disc: std({ map: TX.disc, roughness: 0.38, metalness: 0.85 }),
  discEdge: std({ color: lin(0x5f6164), roughness: 0.5, metalness: 0.8 }),
  interior: std({ color: lin(0x1c1d20), roughness: 0.85 }),
  interiorBack: std({ color: lin(0x1a1b1e), roughness: 0.9, side: THREE.BackSide }),
  invisible: new THREE.MeshBasicMaterial({ visible: false }),
  leather: std({ color: lin(0x222326), roughness: 0.55, bumpMap: TX.grain, bumpScale: 0.001 }),
  glass: phys({ color: lin(0x0b1218), metalness: 0, roughness: 0.02, transparent: true, opacity: 0.58, clearcoat: 1, clearcoatRoughness: 0, envMapIntensity: 1.6 }),
  lens: phys({ color: lin(0xffffff), metalness: 0, roughness: 0, transparent: true, opacity: 0.16, clearcoat: 1, envMapIntensity: 2 }),
  redLens: phys({ color: lin(0x8a0a0a), metalness: 0, roughness: 0.05, transparent: true, opacity: 0.72, clearcoat: 1, envMapIntensity: 1.5 }),
  amber: std({ color: lin(0xff8a00), emissive: lin(0xff7a00), emissiveIntensity: 0.5, roughness: 0.2 }),
  mirror: std({ color: lin(0xe3e9ef), roughness: 0.02, metalness: 1 }),
  gap: std({ color: lin(0x050505), roughness: 0.7 }),
  crack: new THREE.MeshBasicMaterial({ color: lin(0xe8f1f7), transparent: true, opacity: 0.6 }),
  tape: std({ color: lin(0xb0b0aa), roughness: 0.75 }),
  screen: std({ color: lin(0x050a12), emissive: lin(0x1d4f8a), emissiveIntensity: 0.6, roughness: 0.15 }),
  logo: std({ map: TX.logo, roughness: 0.2, metalness: 0.6 }),
  reflector: std({ color: lin(0x7a0000), emissive: lin(0x3a0000), roughness: 0.2 }),
};
function paintMat(t) {
  if (t === 0) {
    const rc = cvs(2048, 1024, (g, w, h) => {

function endRun(reason) {
  state = 'over';
  const dist = Math.min(GOAL, car.z), won = reason === 'ziel';
  const distCoins = Math.floor(dist / 10) + Math.floor(Math.pow(dist / 400, 2) * 10);  // weiter = überproportional mehr
  const bonus = won ? 300 : 0;
  const total = distCoins + car.coins + bonus;
  const rec = dist > save.best;
  save.coins += total; if (rec) save.best = dist; if (won) save.wins++; store();
  const titles = { ziel: '🏆 Im Ziel!', schrott: '💥 Totalschaden!', sprit: '⛽ Tank leer!' };
  showMsg(titles[reason], 1.6);
  setTimeout(() => {
    ['hud', 'speed', 'ctrlL', 'ctrlR', 'pauseBtn', 'muteBtn'].forEach(id => $(id).classList.add('hide'));
    $('result').innerHTML = `<h1>${titles[reason]}</h1>
      <div class="sub">${Math.round(dist)} m von ${GOAL} m${rec ? ' · 🎉 Neuer Rekord!' : ''}</div>
      <div class="res">Strecke <b>+${distCoins} 🪙</b><br>Eingesammelt <b>+${car.coins} 🪙</b>${won ? '<br>Ziel-Bonus <b>+300 🪙</b>' : ''}
      <hr style="border:0;border-top:1px solid #ddd">Gesamt <b class="money">+${total} 🪙</b></div>
      <button class="go" id="backBtn">🔧 Zur Werkstatt</button>`;
    $('result').classList.remove('hide');
    $('backBtn').onclick = () => { $('result').classList.add('hide'); state = 'garage'; resetCar(); resetCourse(); renderGarage(); $('garage').classList.remove('hide'); };
  }, 1700);
}

function hit(dmg, slow) {
  car.hp -= dmg; car.v *= slow; shake = Math.min(1, 0.3 + dmg / 30); flash();
  for (let i = 0; i < 3; i++) puff(car.x + (Math.random() - 0.5) * 2, 1, car.z + 2, 0x777777);
}

function update(dt) {
  const c = car;
  const gas = keys.up && c.fuel > 0;
  if (gas) c.v += S.acc * dt * (1 - 0.5 * c.v / S.maxV);
  if (keys.down) c.v -= 28 * dt;
  if (!gas && !keys.down) c.v -= 4 * dt;
  c.v = Math.max(0, Math.min(c.v, S.maxV));
  c.fuel = Math.max(0, c.fuel - dt * (gas ? 1 : 0.15));

  // Lenken
  const steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  const onGround = c.y <= 0.01;
  let target = steer * S.grip * Math.min(1, c.v / 6 + 0.2);
  if (c.oil > 0) { c.oil -= dt; target = c.vx + Math.sin(performance.now() / 120) * 4; }
  const resp = onGround ? (c.oil > 0 ? 1 : 10) : 2;
  c.vx += (target - c.vx) * Math.min(1, resp * dt);
  c.x += c.vx * dt;
  if (Math.abs(c.x) > ROAD - 1.1) {
    c.x = Math.sign(c.x) * (ROAD - 1.1);
    if (Math.abs(c.vx) > 4 && c.v > 8) { hit(2, 0.9); }
    c.vx *= -0.3;
  }
  c.z += c.v * dt;

  // Boden / Rampen
  let gh = 0, onRamp = false;
  // Kollisionen
  while (c.lo < objs.length && objs[c.lo].z < c.z - 12) c.lo++;
  for (let i = c.lo; i < objs.length && objs[i].z < c.z + 6; i++) {
    const o = objs[i]; if (!o.active) continue;
    if (Math.abs(c.x - o.x) > o.hw + 1.0 || Math.abs(c.z - o.z) > o.hd + 2.0) continue;
    if (o.type === 'ramp') {
      if (Math.abs(c.x - o.x) < o.hw + 0.4) { const f = (c.z - (o.z - 3.5)) / 7; if (f >= 0 && f <= 1) { gh = Math.max(gh, f * 1.94); onRamp = true; } }
      continue;
    }
    if (c.y > o.h - 0.1 && o.type !== 'coin' && o.type !== 'fuel') continue;  // drübergesprungen
    switch (o.type) {
      case 'coin': c.coins += 2; o.active = false; o.mesh.visible = false; break;
      case 'fuel': c.fuel = Math.min(S.fuel, c.fuel + 7); o.active = false; o.mesh.visible = false; showMsg('+ Sprit ⛽', 0.8); break;
      case 'oil': if (onGround && c.oil <= 0) { c.oil = 1.2; showMsg('Öl! 🛢️', 0.7); } break;
      case 'cone': hit(1, 0.93); o.active = false; o.mesh.visible = false; break;
      case 'crate': hit(4 + c.v * 0.25, 0.6); o.active = false; o.mesh.visible = false; break;
      case 'barrel': hit(6 + c.v * 0.3, 0.6); o.active = false; o.mesh.visible = false; for (let k = 0; k < 4; k++) puff(o.x, 1, o.z, 0xff7b00); break;
      case 'wall':
        if (o.brk) { hit(10 + c.v * 0.7, 0.3); o.active = false; o.mesh.visible = false; for (let k = 0; k < 5; k++) puff(c.x + (k - 2), 1, o.z, 0xa0692f); showMsg('Durchgebrochen! 💥', 0.8); }
        else { hit(6 + c.v * 0.9, 0); c.z = o.z - o.hd - 2.05; showMsg('KRACH! 💥', 0.8); }
        break;
    }
  }
  if (c.y <= gh + 0.01 && c.vy <= c.v * 0.28 + 0.01) {
    c.y = gh; c.vy = onRamp ? c.v * 0.28 : 0;
  } else {
    c.vy -= 25 * dt; c.y += c.vy * dt;
    if (c.y < gh) { if (c.vy < -14) hit(3, 0.95); c.y = gh; c.vy = 0; }
  }

  carMesh.position.set(c.x, c.y, c.z);
  carMesh.rotation.y = c.vx * 0.03 + (c.oil > 0 ? Math.sin(performance.now() / 90) * 0.3 : 0);
  carMesh.rotation.x = onRamp ? -0.28 : (c.y > 0.05 ? -c.vy * 0.015 : 0);
  animateCar(dt, c.v, steer, gas, keys.down);

  if (c.hp < S.hp * 0.35 && Math.random() < dt * 15) puff(c.x, c.y + 1.2, c.z + 1.5, 0x333333);
  if (tier() === 0 && gas && Math.random() < dt * 6) puff(c.x + 0.5, c.y + 0.5, c.z - 2.2, 0x888888); // Schrott qualmt

  // HUD
  $('distTxt').textContent = Math.round(c.z) + ' / ' + GOAL + ' m';
  $('progFill').style.width = Math.min(100, c.z / GOAL * 100) + '%';
  $('hpFill').style.width = Math.max(0, c.hp / S.hp * 100) + '%';
  $('fuelFill').style.width = c.fuel / S.fuel * 100 + '%';
  $('coinsRun').textContent = '🪙 ' + c.coins;
  $('speed').innerHTML = Math.round(c.v * 3.6) + ' <small>km/h</small>';

  if (c.z >= GOAL) endRun('ziel');
  else if (c.hp <= 0) endRun('schrott');
  else if (c.fuel <= 0 && c.v < 0.3 && c.y <= 0.01) endRun('sprit');
}

// ---------- Loop ----------
const clock = new THREE.Clock();
let t = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  engineSound();
  if (paused) { renderer.render(scene, camera); return; }   // eingefroren, Zeit läuft nicht weiter
  t += dt;
  if (state === 'run') update(dt);
  else if (state === 'over') { car.v *= Math.pow(0.3, dt); car.z += car.v * dt; carMesh.position.z = car.z; }

  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').textContent = ''; }

  // Münzen drehen
  for (let i = car.lo || 0; i < objs.length && objs[i].z < (car.z || 0) + 120; i++) {
    const o = objs[i]; if (o.type === 'coin' || o.type === 'fuel') { o.mesh.rotation.y = t * 3; o.mesh.position.y = o.by + Math.sin(t * 3 + o.z) * 0.15; }
  }
  smoke.forEach(s => { if (s.life > 0) { s.life -= dt * 1.2; s.m.position.y += dt * 1.5; s.m.scale.multiplyScalar(1 + dt * 1.5); s.m.material.opacity = Math.max(0, s.life * 0.6); } });

  if (state === 'garage') {
    const a = t * 0.4;
    const port = camera.aspect < 1, d = port ? 10.5 : 7.2;   // Hochformat: weiter weg, Auto über dem Werkstatt-Panel
    camera.position.set(Math.sin(a) * d, port ? 3.2 : 2.4, Math.cos(a) * d);
    camera.lookAt(0, port ? -3.4 : -1.3, 0);
    carMesh.position.set(0, 0, 0); carMesh.rotation.set(0, 0, 0);
  } else {
    shake *= Math.pow(0.02, dt);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    camera.position.lerp(new THREE.Vector3(car.x * 0.6 + sx, 4.8 + car.y * 0.5 + sy, car.z - 10), 1 - Math.exp(-8 * dt));
    camera.lookAt(car.x * 0.8, 1 + car.y * 0.6, car.z + 8);
  }
  if (state === 'over') animateCar(dt, car.v, 0, false, true);
  shadow.position.set(carMesh.position.x, 0.035, carMesh.position.z);
  shadow.rotation.z = -carMesh.rotation.y;
  shadow.material.opacity = Math.max(0.25, 1 - carMesh.position.y * 0.15);
  skyDome.position.copy(camera.position); farGroup.position.set(camera.position.x, 0, camera.position.z);
  const cz = carMesh.position.z; for (const o of objs) o.mesh.visible = o.active && o.z > cz - 40 && o.z < cz + 260;   // nur nahe Hindernisse zeichnen
  sun.position.set(carMesh.position.x + 40, 100, carMesh.position.z - 30); sun.target.position.copy(carMesh.position);
  renderer.render(scene, camera);
}
function linearizeScene() {
  scene.traverse(o => {
    if (o.isLight && !o.userData.lin) { o.userData.lin = true; o.color.convertSRGBToLinear(); if (o.groundColor) o.groundColor.convertSRGBToLinear(); }
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.userData.lin) return; m.userData.lin = true;
      ['color', 'emissive', 'specular'].forEach(k => { if (m[k] && m[k].isColor) m[k].convertSRGBToLinear(); });
      if (m.map && !m.map._lin) { m.map.encoding = THREE.sRGBEncoding; m.map._lin = true; m.map.needsUpdate = true; }
      m.needsUpdate = true;
    });
  });
}
linearizeScene();
resetCar(); renderGarage(); loop(); $('loading').remove();

// ---------- PWA: Service Worker (Offline-Betrieb) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:')
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
